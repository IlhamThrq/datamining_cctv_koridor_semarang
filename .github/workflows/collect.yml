name: Collect Corridor Frames

on:
  schedule:
    - cron: "*/10 * * * *" # UTC; WIB = UTC+7. GitHub jitter is +-3-10 min; real timestamps are logged per frame.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corridor-collect
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collector.txt

      - name: Install collector dependencies
        run: pip install -r requirements-collector.txt

      - name: Capture one cycle (13 corridor cameras)
        run: python capture_koridor.py --duration 5 --timeout 20 --threads 7

      - name: Commit and push captured data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_koridor/
          if git diff --cached --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "capture: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
